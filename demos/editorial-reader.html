<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VIDEREAD · 全文</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/fraunces@5.1.0/index.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/fraunces@5.1.0/500.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/noto-serif-sc@5.1.0/index.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/noto-serif-sc@5.1.0/500.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/ibm-plex-mono@5.1.0/index.css">
<style>
:root{
  --paper:#FAF7F1; --paper-deep:#F3EEE3;
  --ink:#17140E; --muted:#6E675A; --faint:#A39B8A;
  --hairline:#D9D2C2; --accent:#A6331E;
  --serif:"Fraunces","Noto Serif SC","Source Han Serif SC","Songti SC","STZhongsong","SimSun",serif;
  --sans:"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Consolas,monospace;
}
*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.75;-webkit-font-smoothing:antialiased;}
::selection{background:var(--accent);color:var(--paper);}
#progress{position:fixed;top:0;left:0;height:2px;width:0;background:var(--accent);z-index:9;}

.bar{
  position:sticky;top:0;z-index:5;background:var(--paper);border-bottom:1px solid var(--hairline);
  display:flex;align-items:baseline;gap:18px;padding:14px 32px;
}
.bar .back{border:0;background:none;cursor:pointer;font-family:var(--mono);font-size:13px;letter-spacing:2px;color:var(--ink);padding:0;text-decoration:none;transition:color .25s;}
.bar .back:hover{color:var(--accent);}
.bar .rt{flex:1;font-family:var(--serif);font-weight:500;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.bar .rp{font-family:var(--mono);font-size:11px;color:var(--faint);letter-spacing:1px;}

.page{max-width:760px;margin:0 auto;padding:56px 32px 120px;}
.page h1{font-family:var(--serif);font-weight:600;font-size:clamp(30px,5vw,42px);line-height:1.3;margin:0 0 14px;}
.page .subtitle{font-family:var(--serif);font-weight:500;font-size:17px;color:var(--muted);margin:0 0 18px;}
.page .lead{font-size:16.5px;line-height:1.95;color:#2E2A20;}
.page .attribution{font-family:var(--mono);font-size:11.5px;color:var(--faint);letter-spacing:1px;margin:18px 0 0;padding-bottom:20px;border-bottom:1px solid var(--hairline);line-height:1.9;}
.page .attribution a{color:var(--accent);text-decoration:none;}
.page h2{font-family:var(--serif);font-weight:500;font-size:24px;line-height:1.45;border-top:2px solid var(--ink);margin:52px 0 18px;padding-top:22px;scroll-margin-top:84px;}
.page h2 .num{font-family:var(--mono);font-size:13px;color:var(--accent);margin-right:12px;letter-spacing:1px;}
.page h2 .section-time{float:right;font-family:var(--mono);font-size:11px;color:var(--faint);font-weight:400;letter-spacing:1px;padding-top:9px;}
.page h3{font-family:var(--serif);font-weight:500;font-size:18px;margin:30px 0 10px;}
.page p{font-size:16px;line-height:1.95;margin:0 0 1.35em;color:#26221A;text-align:justify;}
.page ul,.page ol{margin:0 0 1.4em 1.5em;}
.page li{margin-bottom:.4em;line-height:1.8;}
.page blockquote{border-top:1px solid var(--ink);border-bottom:1px solid var(--ink);padding:20px 6px;margin:30px 0;font-family:var(--serif);font-weight:500;font-size:19px;line-height:1.7;}
.page img{max-width:100%;height:auto;border:1px solid var(--hairline);}
.page figure{margin:26px 0;}
.page figcaption{font-family:var(--mono);font-size:11px;color:var(--faint);letter-spacing:1px;margin-top:8px;}
.page table{width:100%;border-collapse:collapse;font-size:14px;margin:24px 0;}
.page th{font-family:var(--mono);font-weight:400;font-size:11px;letter-spacing:1.5px;color:var(--faint);text-align:left;border-bottom:2px solid var(--ink);padding:8px 6px;}
.page td{border-bottom:1px solid var(--hairline);padding:9px 6px;vertical-align:top;}
.page .callout{border-left:3px solid var(--accent);background:var(--paper-deep);padding:16px 20px;margin:24px 0;font-size:15px;}
.page .callout p:last-child,.page .cards p:last-child{margin-bottom:0;}
.page .cards,.page .comparison,.page .stats{margin:26px 0;}
.page .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;}
.page .cards > *{border:1px solid var(--hairline);padding:16px;}
.page .stats{display:flex;gap:32px;flex-wrap:wrap;border-top:2px solid var(--ink);padding-top:16px;}
.page .stat-value{font-family:var(--serif);font-weight:600;font-size:30px;line-height:1.2;}
.page .stat-label{font-family:var(--mono);font-size:11px;letter-spacing:1.5px;color:var(--faint);}
.page .keyline{border-top:1px solid var(--ink);margin:30px 0;}
.page .meta-fold,.page .sources{border:1px solid var(--hairline);background:var(--paper-deep);padding:14px 18px;margin:22px 0;font-size:14px;line-height:1.8;}
.page .meta-fold{margin-top:30px;}
.page .report-foot{margin-top:48px;border-top:1px solid var(--hairline);padding-top:24px;}
.page .report-foot p{font-size:13.5px;color:var(--muted);}
.page .meta-fold summary,.page .sources summary{cursor:pointer;font-family:var(--mono);font-size:11px;letter-spacing:2px;color:var(--muted);}
.page a{color:var(--accent);}
.page .ts-jump{
  display:inline-block;margin-left:8px;padding:1px 9px;
  font-family:var(--mono);font-size:11px;line-height:1.7;
  color:var(--accent);background:var(--paper-deep);
  border:1px solid var(--hairline);border-radius:999px;
  text-decoration:none;vertical-align:middle;white-space:nowrap;
  font-variant-numeric:tabular-nums;letter-spacing:.5px;
  /* 胶囊可能被注入成 flex/grid 子项（如卡片容器自身带 data-source-units），
     显式禁止两个方向被拉伸，否则 border-radius:999px 会放大成椭圆 */
  justify-self:start;align-self:start;flex:0 0 auto;width:auto;height:auto;
}
.page .ts-jump:hover{border-color:var(--accent);}
/* 卡片/对比容器自身带 data-source-units 时，胶囊独占一行排在卡片之后 */
.page .cards > .ts-jump,.page .comparison > .ts-jump,.page .stats > .ts-jump{grid-column:1/-1;margin-top:2px;}
.skeleton{color:var(--faint);font-family:var(--mono);font-size:12px;letter-spacing:2px;padding:48px 0;}
.foot{max-width:760px;margin:0 auto;padding:0 32px 72px;}
.foot-inner{border-top:3px double var(--ink);padding-top:22px;display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:12px;}
.foot .c1{font-family:var(--serif);font-weight:600;font-size:15px;}
.foot .c1 em{font-style:italic;color:var(--accent);}
.foot .c2{font-family:var(--mono);font-size:11px;letter-spacing:1.5px;color:var(--faint);}
@media (prefers-reduced-motion: reduce){ html{scroll-behavior:auto;} }
@media (max-width:640px){ .page{padding:40px 20px 96px;} .bar{padding:12px 20px;} }
</style>
</head>
<body>

<div id="progress"></div>

<div class="bar">
  <a class="back" id="back" href="/editorial">← 编辑部</a>
  <span class="rt" id="reader-title"></span>
  <span class="rp" id="reader-run"></span>
</div>

<main class="page" id="reader-page">
  <p class="skeleton">正在翻开这一期…</p>
</main>

<footer class="foot">
  <div class="foot-inner">
    <div class="c1">VIDEREAD <em>视读</em></div>
    <div class="c2">用 AI 重新阅读视频 — MMXXVI</div>
  </div>
</footer>

<script>
"use strict";
const API = (location.protocol === "file:") ? "http://127.0.0.1:8765" : "";
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

const params = new URLSearchParams(location.search);
let runId = params.get("run_id") || "";
if(!runId){
  const seg = location.pathname.split("/").filter(Boolean).pop() || "";
  if(seg !== "read" && seg !== "editorial-reader.html") runId = decodeURIComponent(seg);
}
const sec = parseInt(params.get("sec") || "0", 10);

const page = document.getElementById("reader-page");
const progress = document.getElementById("progress");
let progTicking = false;
function updateProgress(){
  const h = document.documentElement;
  progress.style.width = (h.scrollTop / (h.scrollHeight - h.clientHeight) * 100) + "%";
  progTicking = false;
}
addEventListener("scroll", () => {
  if(progTicking) return;
  progTicking = true;
  requestAnimationFrame(updateProgress);
}, {passive: true});

if(!runId){
  page.innerHTML = '<p class="skeleton">缺少 run_id —— 请从编辑部目录进入某一期。</p>';
}else{
  open(runId, sec);
}

async function open(runId, sec){
  try{
    const res = await fetch(API + "/report/" + encodeURIComponent(runId));
    if(!res.ok) throw new Error("HTTP " + res.status);
    const doc = new DOMParser().parseFromString(await res.text(), "text/html");
    const head = doc.querySelector(".report-head");
    const body = doc.querySelector(".report-body");
    if(!body) throw new Error("no body");
    /* 先从被剥离的脚本里抢救时间映射 window.__VTS（u0001 → start 秒），
       阅读器自己负责注入段落级时间戳跳转胶囊（原报告由内嵌脚本完成）。 */
    let vts = null;
    doc.querySelectorAll("script").forEach(s => {
      const m = /window\.__VTS\s*=\s*\[([^\]]*)\]\s*;/.exec(s.textContent || "");
      if(m && vts === null){
        const arr = m[1].split(",").map(x => parseFloat(x.trim()));
        vts = arr.every(Number.isFinite) ? arr : null;
      }
    });
    body.querySelectorAll("script,style,noscript").forEach(n => n.remove());
    let i = 0;
    body.querySelectorAll("h2").forEach(h => { i++; h.id = "sec-" + i; });

    page.innerHTML = "";
    const frag = document.createDocumentFragment();
    if(head){
      ["h1", ".subtitle", ".lead", ".attribution"].forEach(sel => {
        const n = head.querySelector(sel);
        if(n) frag.appendChild(n);
      });
    }
    frag.appendChild(body);
    /* report-body 之外的伴生内容：视频简介折叠块（head 内）与
       report-foot 里的「来源与处理说明」——不搬会整块丢失。 */
    if(head){
      const mfold = head.querySelector(".meta-fold");
      if(mfold) frag.appendChild(mfold);
    }
    const rfoot = doc.querySelector(".report-foot");
    if(rfoot) frag.appendChild(rfoot);
    page.appendChild(frag);
    injectTsJumps(vts);
    const h1 = page.querySelector("h1");
    document.title = (h1 ? h1.textContent.trim() + " — " : "") + "VIDEREAD 视读";
    document.getElementById("reader-title").textContent = h1 ? h1.textContent.trim() : "";
    document.getElementById("reader-run").textContent = runId;
    document.getElementById("back").href = "/editorial";
    if(location.protocol === "file:") document.getElementById("back").href = "about:blank";
    if(sec) jump(sec);
  }catch(err){
    page.innerHTML = '<p class="skeleton">全文读取失败（' + esc(String(err.message || err)) +
      '）。这份报告可能还没有生成 report.html，回编辑部看看其它期。</p>';
  }
}

function jump(sec){
  const el = page.querySelector("#sec-" + sec);
  if(el) requestAnimationFrame(() => el.scrollIntoView({behavior: "smooth", block: "start"}));
}

/* 段落级时间戳跳转：逻辑与原报告内嵌脚本一致——取段落
   data-source-units 引用的转写单元中最早的 start 秒，生成
   "▷ mm:ss" 胶囊，新标签打开原视频对应时刻。 */
function injectTsJumps(vts){
  if(!vts || !vts.length) return;
  const origin = page.querySelector('.attribution a[href^="http"]');
  if(!origin) return;
  const base = origin.getAttribute("href");
  const pad = n => (n < 10 ? "0" : "") + n;
  const stamp = sec => {
    const t = Math.max(0, Math.round(sec));
    const h = Math.floor(t / 3600), m = Math.floor((t % 3600) / 60), s = t % 60;
    return (h ? h + ":" + pad(m) : pad(m)) + ":" + pad(s);
  };
  page.querySelectorAll("[data-source-units]").forEach(block => {
    const ids = (block.getAttribute("data-source-units") || "").split(",");
    let best = -1;
    ids.forEach(id => {
      const m = /^u(\d+)$/.exec(id.trim());
      if(!m) return;
      const sec = vts[parseInt(m[1], 10) - 1];
      if(typeof sec === "number" && sec >= 0 && (best < 0 || sec < best)) best = sec;
    });
    if(best < 0) return;
    const a = document.createElement("a");
    a.className = "ts-jump";
    a.href = base + (base.indexOf("?") >= 0 ? "&" : "?") + "t=" + Math.round(best);
    a.target = "_blank";
    a.rel = "noopener";
    a.textContent = "▷ " + stamp(best);
    block.appendChild(a);
  });
}
</script>
</body>
</html>
