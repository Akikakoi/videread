<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script>(function(){var t;try{t=localStorage.getItem("videread.theme")}catch(e){}if(!t)t="system";var d=t==="dark"||(t==="system"&&window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches);document.documentElement.dataset.theme=d?"dark":"light";})();</script>
<title>投印工单 · VIDEREAD 视读</title>
<style>
:root{
  --paper:#FAF7F1; --paper-deep:#F3EEE3;
  --ink:#17140E; --muted:#6E675A; --faint:#A39B8A;
  --hairline:#D9D2C2; --accent:#A6331E;
  --serif:"Fraunces","Noto Serif SC","Source Han Serif SC","Songti SC","STZhongsong","SimSun",serif;
  --sans:"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Consolas,monospace;
  --ease:cubic-bezier(.22,.61,.36,1);--t-fast:.18s;--t:.28s;--t-slow:.8s;
  --ok:#2E6B4F;
}

/* ── 深夜印刷间：深色主题令牌（浅色配方整体翻转，强调红提亮保对比）── */
html[data-theme="dark"]{
  --paper:#14120E; --paper-deep:#1C1914;
  --ink:#EDE6D6; --muted:#A89F8C; --faint:#6E675A;
  --hairline:#3A352B; --accent:#D0563C; --ok:#6FB98C;
}
html.theme-switching *,html.theme-switching *::before,html.theme-switching *::after{transition:none!important;}

*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font-family:var(--sans);font-size:15px;line-height:1.7;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:1016px;margin:0 auto;padding:0 32px;}

/* ---------- 报头（工单页精简版） ---------- */
header{padding:34px 0 22px;border-bottom:3px double var(--ink);}
.masthead{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:12px;}
.wordmark{font-family:var(--serif);font-weight:600;font-size:26px;letter-spacing:.5px;}
.wordmark em{font-style:italic;color:var(--accent);font-weight:500;}
.masthead nav a{font-size:13px;color:var(--muted);text-decoration:none;letter-spacing:1px;transition:color var(--t);}
.masthead nav a:hover{color:var(--accent);}
.theme-btn{border:1px solid var(--hairline);background:transparent;cursor:pointer;font-family:var(--mono);font-size:11.5px;letter-spacing:1px;color:var(--muted);padding:5px 12px;border-radius:99px;transition:color var(--t),border-color var(--t);}
.theme-btn:hover{color:var(--accent);border-color:var(--accent);}

/* ---------- 工单主体 ---------- */
.rubric{font-family:var(--mono);font-size:11px;letter-spacing:3px;color:var(--faint);text-transform:uppercase;}
h1{
  font-family:var(--serif);font-weight:600;font-size:40px;line-height:1.15;
  margin:14px 0 6px;letter-spacing:.5px;
}
.job-url{
  font-family:var(--mono);font-size:12.5px;color:var(--muted);letter-spacing:.3px;
  overflow-wrap:anywhere;margin:0 0 20px;
}
.meta{display:flex;flex-wrap:wrap;gap:8px 28px;border-top:1px solid var(--hairline);border-bottom:1px solid var(--hairline);padding:14px 2px;margin-bottom:26px;}
.meta span{font-family:var(--mono);font-size:11.5px;letter-spacing:.5px;color:var(--muted);}
.meta span b{color:var(--ink);font-weight:400;}
.meta span .q{color:var(--accent);}

/* ---------- 八阶段步进器（与主页同款） ---------- */
.stepper{list-style:none;border-top:2px solid var(--ink);margin:0 0 30px;padding:0;}
.stepper li{display:flex;align-items:baseline;gap:14px;padding:11px 2px;border-bottom:1px solid var(--hairline);color:var(--faint);transition:color var(--t);}
.stepper .no{font-family:var(--mono);font-size:12px;min-width:26px;}
.stepper .t{font-size:14.5px;font-family:var(--serif);}
.stepper .mark{margin-left:auto;font-family:var(--mono);font-size:12px;display:inline-block;}
.stepper li.cur{color:var(--ink);}
.stepper li.cur .mark{color:var(--accent);}
.stepper li.cur .t::after{content:" …";}
.stepper li.done{color:var(--muted);}
.stepper li.done .mark{color:var(--ok);}
.stepper li.pop .mark{animation:markPop .3s var(--ease) 1;}
@keyframes markPop{from{transform:scale(.5);opacity:0}to{transform:scale(1);opacity:1}}

/* ---------- 排印日志：铅字校样 ---------- */
.proof-h{font-family:var(--mono);font-size:10px;letter-spacing:3px;color:var(--faint);margin-bottom:8px;}
.proof{
  background:var(--paper-deep);border:1px solid var(--hairline);
  padding:14px 16px;max-height:340px;overflow-y:auto;
  font-family:var(--mono);font-size:11.5px;line-height:1.9;color:var(--muted);
  letter-spacing:.2px;white-space:pre-wrap;overflow-wrap:anywhere;
}
.proof .line{display:block;}
.proof .line.err{color:var(--accent);}

/* ---------- 操作行 ---------- */
.actions{display:flex;gap:14px;flex-wrap:wrap;margin-top:26px;}
.act{
  display:inline-block;font-family:var(--mono);font-size:12.5px;letter-spacing:1.5px;
  color:var(--ink);text-decoration:none;background:transparent;cursor:pointer;
  border:1px solid var(--hairline);padding:12px 22px;
  transition:color var(--t),border-color var(--t),transform var(--t) var(--ease);
}
.act:hover{color:var(--accent);border-color:var(--accent);transform:translateY(-3px);}
.act.danger:hover{color:var(--accent);}
.job-err{color:var(--accent);font-size:14px;}

/* ---------- toast ---------- */
#toast{
  position:fixed;right:24px;bottom:24px;z-index:98;
  background:var(--ink);color:var(--paper);
  font-family:var(--mono);font-size:12.5px;letter-spacing:.5px;
  padding:12px 18px;max-width:360px;display:none;
  border-left:3px solid var(--accent);
  animation:toastIn var(--t) var(--ease) both;
}
#toast.out{animation:toastOut .28s var(--ease) both;}
@keyframes toastIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes toastOut{from{opacity:1;transform:none}to{opacity:0;transform:translateY(-8px)}}

@media (max-width:860px){
  h1{font-size:30px;}
  .wrap{padding:0 20px;}
}
@media (prefers-reduced-motion: reduce){
  html{scroll-behavior:auto;}
  .act:hover{transform:none;}
  .stepper li.pop .mark{animation:none;}
  #toast,#toast.out{animation:none;}
}

/* ---------- 细滚条（编辑风） ---------- */
.proof::-webkit-scrollbar{width:8px;}
.proof::-webkit-scrollbar-track{background:transparent;}
.proof::-webkit-scrollbar-thumb{background:var(--hairline);border-radius:4px;}
.proof::-webkit-scrollbar-thumb:hover{background:var(--muted);}
.proof{scrollbar-width:thin;scrollbar-color:var(--hairline) transparent;}

/* ---------- 页面级滚动条：装订线打孔 + 红色游标 ----------
   轨道 = 一列打孔圆点（骑马钉装订边），滑块 = 红色游标（上下留隙） ---------- */
::-webkit-scrollbar{width:9px;height:9px;}
::-webkit-scrollbar-track{
  background-image:radial-gradient(circle, var(--hairline) 1.6px, transparent 2.2px);
  background-size:9px 28px;background-repeat:repeat-y;background-position:center;
}
::-webkit-scrollbar:horizontal{
  background-image:radial-gradient(circle, var(--hairline) 1.6px, transparent 2.2px);
  background-size:28px 9px;background-repeat:repeat-x;background-position:center;
}
::-webkit-scrollbar-thumb{
  background:var(--accent);
  border-top:3px solid transparent;border-bottom:3px solid transparent;
  background-clip:padding-box;
}
::-webkit-scrollbar-thumb:hover{background:var(--ink);background-clip:padding-box;}
html{scrollbar-width:thin;scrollbar-color:var(--accent) transparent;}
</style>
</head>
<body>
<header class="wrap">
  <div class="masthead">
    <div class="wordmark">VIDEREAD <em>视读</em></div>
    <nav><button class="theme-btn" id="theme-toggle" type="button" aria-label="切换主题"></button><a href="/editorial">← 回到编辑部</a></nav>
  </div>
</header>

<main class="wrap">
  <section id="jobblock">
    <div class="rubric">JOB · 投印工单</div>
    <h1 id="job-state">读取中…</h1>
    <p class="job-url" id="job-url">—</p>
    <div class="meta" id="job-meta"></div>
    <ol class="stepper" id="stepper"></ol>
    <div class="proof-h">LOG · 排印日志</div>
    <div class="proof" id="log"></div>
    <div class="actions" id="job-actions"></div>
    <p class="job-err" id="job-err"></p>
  </section>
</main>

<div id="toast" role="status"></div>

<script>
"use strict";
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const STAGES = ["下载","音频处理","转写","规范化","结构规划","截图","逐节写作","渲染"];
const STATE_ZH = {queued:"排队中",running:"印制中",done:"印毕",cancelled:"已取消",failed:"失败",error:"失败"};
const TERMINAL = new Set(["done","cancelled","failed","error"]);
const job_id = decodeURIComponent(location.pathname.split("/").pop() || "");

/* ---------- toast ---------- */
let toastH = null, toastOutH = null;
function toast(msg){
  const t = $("#toast");
  t.textContent = msg;
  clearTimeout(toastH); clearTimeout(toastOutH);
  t.classList.remove("out");
  t.style.display = "block";
  void t.offsetWidth;
  toastH = setTimeout(() => {
    t.classList.add("out");
    toastOutH = setTimeout(() => { t.style.display = "none"; t.classList.remove("out"); }, 280);
  }, 3600);
}

/* ---------- 数据获取 ---------- */
async function getSnapshot(){
  const r = await fetch("/api/jobs/" + encodeURIComponent(job_id));
  if(!r.ok){
    let detail = r.status;
    try{ const j = await r.json(); if(j && j.detail) detail = j.detail; }catch(e){}
    throw new Error(detail);
  }
  return await r.json();
}
async function postCancel(){
  const r = await fetch("/api/jobs/" + encodeURIComponent(job_id) + "/cancel", {method: "POST"});
  if(!r.ok){
    let detail = r.status;
    try{ const j = await r.json(); if(j && j.detail) detail = j.detail; }catch(e){}
    throw new Error(detail);
  }
}

/* ---------- 渲染 ---------- */
let stepperSeen = new Set();
function renderStepper(current, doneSet){
  const ul = $("#stepper");
  ul.innerHTML = STAGES.map((name, i) => {
    const no = String(i + 1).padStart(2, "0");
    if(doneSet.has(i)){
      const pop = !stepperSeen.has(i) && stepperSeen.size > 0 ? " pop" : "";
      return '<li class="done' + pop + '"><span class="no">' + no + '</span><span class="t">' + esc(name) + '</span><span class="mark">✓</span></li>';
    }
    if(i === current) return '<li class="cur"><span class="no">' + no + '</span><span class="t">' + esc(name) + '</span><span class="mark">●</span></li>';
    return '<li><span class="no">' + no + '</span><span class="t">' + esc(name) + '</span><span class="mark">·</span></li>';
  }).join("");
  stepperSeen = new Set(doneSet);
}

function pushLog(line, isErr){
  const box = $("#log");
  const el = document.createElement("span");
  el.className = "line" + (isErr ? " err" : "");
  el.textContent = line;
  box.appendChild(el);
  box.scrollTop = box.scrollHeight;
}

function stateZh(s){ return STATE_ZH[s] || s || "—"; }

function renderActions(job){
  const box = $("#job-actions");
  box.innerHTML = "";
  const mk = (label, href, cls) => {
    const a = document.createElement("a");
    a.className = "act" + (cls ? " " + cls : "");
    a.href = href;
    a.textContent = label;
    return a;
  };
  if(job.state === "done" && job.run_id){
    box.appendChild(mk("翻开全文 →", "/read/" + encodeURIComponent(job.run_id)));
    box.appendChild(mk("原样打开", "/report/" + encodeURIComponent(job.run_id)));
  }
  if(job.state === "queued" || job.state === "running"){
    const b = document.createElement("button");
    b.className = "act danger";
    b.type = "button";
    b.textContent = "取消投印";
    b.addEventListener("click", async () => {
      b.disabled = true;
      try{
        await postCancel();
        toast("已请求取消，将在检查点停止");
      }catch(err){
        toast("取消失败：" + err.message);
        b.disabled = false;
      }
    });
    box.appendChild(b);
  }
  box.appendChild(mk("回到编辑部", "/editorial"));
}

function renderJob(job){
  if(TERMINAL.has(job.state) && localStorage.getItem("videread.activeJob") === job.id){
    localStorage.removeItem("videread.activeJob"); /* 终态：清掉主页的进行中标记 */
  }
  $("#job-state").textContent = stateZh(job.state);
  $("#job-url").textContent = job.url || "—";
  const meta = [];
  meta.push("工单号 <b>" + esc(job.id) + "</b>");
  if(job.mode) meta.push("模式 <b>" + esc(job.mode) + "</b>");
  if(job.created_at) meta.push("提交 <b>" + esc(job.created_at) + "</b>");
  if(job.state === "queued" && typeof job.queue_position === "number" && job.queue_position > 0)
    meta.push('<span class="q">队列第 ' + (job.queue_position + 1) + " 位</span>");
  if(job.finished_at) meta.push("结束 <b>" + esc(job.finished_at) + "</b>");
  $("#job-meta").innerHTML = meta.map(s => "<span>" + s + "</span>").join("");

  const idx = Math.min(Math.max(0, job.stage_index || 0), STAGES.length);
  const doneSet = new Set();
  if(job.state === "done"){ for(let i = 0; i < STAGES.length; i++) doneSet.add(i); renderStepper(STAGES.length, doneSet); }
  else if(job.state === "queued"){ renderStepper(-1, doneSet); }
  else { for(let i = 0; i < idx; i++) doneSet.add(i); renderStepper(job.state === "running" ? idx : -1, doneSet); }

  const log = $("#log");
  log.innerHTML = "";
  (job.logs || []).forEach(l => pushLog(l, false));
  if(job.error){
    $("#job-err").textContent = "失败：" + job.error + (job.error_hint ? " · " + job.error_hint : "");
    pushLog("[错误] " + job.error, true);
  }
  renderActions(job);
}

/* ---------- SSE 订阅 + 快照兜底轮询 ---------- */
let es = null, pollTimer = null;
function subscribe(){
  es = new EventSource("/api/jobs/" + encodeURIComponent(job_id) + "/events");
  es.addEventListener("status", ev => {
    const d = JSON.parse(ev.data);
    $("#job-state").textContent = stateZh(d.state);
  });
  es.addEventListener("stage", ev => {
    const d = JSON.parse(ev.data);
    const doneSet = new Set();
    for(let i = 0; i < d.index; i++) doneSet.add(i);
    renderStepper(d.index, doneSet);
  });
  es.addEventListener("log", ev => pushLog(JSON.parse(ev.data).line || "", false));
  es.addEventListener("done", async ev => {
    const d = JSON.parse(ev.data);
    pushLog("[完成] " + (d.run_id || ""));
    es.close(); es = null;
    toast("新的一期印好了");
    renderJob(await getSnapshot()); /* 终态以快照为准，一次渲染收敛 */
  });
  es.addEventListener("cancelled", async ev => {
    const d = JSON.parse(ev.data);
    pushLog("[取消] " + (d.message || "已在最近的检查点停止，已落盘产物保留"));
    es.close(); es = null;
    toast("任务已取消");
    renderJob(await getSnapshot());
  });
  es.addEventListener("error", async ev => {
    if(ev.data){
      const d = JSON.parse(ev.data);
      pushLog("[错误] " + (d.message || "任务失败") + (d.hint ? " · " + d.hint : ""), true);
      es.close(); es = null;
      renderJob(await getSnapshot());
      return;
    }
    /* 连接层错误：改用快照轮询兜底 */
    if(es){ es.close(); es = null; }
    startPolling();
  });
}
function startPolling(){
  if(pollTimer) return;
  pollTimer = setInterval(async () => {
    try{
      const job = await getSnapshot();
      renderJob(job);
      if(TERMINAL.has(job.state)){ clearInterval(pollTimer); pollTimer = null; }
    }catch(e){ /* 服务暂不可达：下个周期再试 */ }
  }, 2500);
}

/* ---------- 启动 ---------- */
(async function init(){
  let job;
  try{
    job = await getSnapshot();
  }catch(err){
    $("#job-state").textContent = "工单不存在";
    $("#job-url").textContent = "工单号 " + job_id + " · " + err.message;
    $("#stepper").outerHTML = '<p style="color:var(--muted);font-size:14px;">链接可能已过期，或工单号有误。<a href="/editorial" style="color:var(--accent)">回到编辑部重新投印 →</a></p>';
    $("#log").style.display = "none";
    $(".proof-h").style.display = "none";
    return;
  }
  renderJob(job);
  /* 终态任务只渲染快照；进行中的才订阅事件流 */
  if(!TERMINAL.has(job.state) && job.state !== "queued") subscribe();
  else if(job.state === "queued") subscribe(); /* 排队中也要等 running/done 事件 */
})();
</script>

<script>
/* ── 主题三档切换：浅色 → 深色 → 跟随系统 ── */
(function(){
  const ORDER = ["light","dark","system"];
  const LABEL = {light:"浅色",dark:"深色",system:"自动"};
  let current;
  try{ current = localStorage.getItem("videread.theme") || "system"; }catch(e){ current = "system"; }
  const btn = document.getElementById("theme-toggle");
  const label = () => { if(btn){ btn.textContent = LABEL[current]; btn.setAttribute("aria-label","主题：" + LABEL[current]); } };
  label();
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", e => {
    let t; try{ t = localStorage.getItem("videread.theme"); }catch(err){}
    if((t || "system") !== "system") return;
    document.documentElement.dataset.theme = e.matches ? "dark" : "light";
  });
  if(btn) btn.addEventListener("click", () => {
    current = ORDER[(ORDER.indexOf(current) + 1) % ORDER.length];
    try{ localStorage.setItem("videread.theme", current); }catch(e){}
    document.documentElement.classList.add("theme-switching");
    const dark = current === "dark" || (current === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
    document.documentElement.dataset.theme = dark ? "dark" : "light";
    label();
    setTimeout(() => document.documentElement.classList.remove("theme-switching"), 250);
  });
})();
</script>
</body>
</html>
