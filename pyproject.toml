[project]
name = "videread"
version = "0.1.0"
description = "Bilibili 视频 / 本地音视频 → 自包含 HTML 阅读报告"
requires-python = ">=3.11"
dependencies = [
    "yt-dlp>=2024.8.6",
    "httpx>=0.27",
    "openai>=1.40",
    "python-dotenv>=1.0",
    "websockets>=13.0",
    "fastapi>=0.110",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
videread = "videread.cli:main"
videread-web = "videread.web:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/videread"]

[tool.hatch.build.targets.wheel.force-include]
"src/videread/templates" = "videread/templates"
"src/videread/web/static" = "videread/web/static"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "network: 需要联网的集成测试（默认不跑，用 -m network 显式启用）",
]
addopts = "-m 'not network'"