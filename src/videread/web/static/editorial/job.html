<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script>(function(){var t;try{t=localStorage.getItem("videread.theme")}catch(e){}if(t!=="light"&&t!=="dark"&&t!=="auto"){t="auto";try{localStorage.setItem("videread.theme",t)}catch(e){}}var sys=t==="auto"&&window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches;document.documentElement.dataset.theme=(t==="dark"||sys)?"dark":"light";})();</script>
<script>if("scrollRestoration" in history)history.scrollRestoration="manual";</script>
<title>投印工单 · VIDEREAD 视读</title>
<link rel="stylesheet" href="/static/editorial/css/base.css">
<link rel="stylesheet" href="/static/editorial/css/job.css">
</head>
<body>
<header class="wrap">
  <div class="masthead">
    <div class="wordmark">VIDEREAD <em>视读</em></div>
    <nav><button class="theme-switch" id="theme-toggle" type="button" aria-label="主题：浅色" data-appearance="light"><span class="track"><span class="knob"></span></span><span class="theme-label">浅色</span></button><a href="/editorial">← 回到编辑部</a></nav>
  </div>
</header>

<main class="wrap">
  <section class="job-sheet">
    <div class="rubric">JOB · 投印工单</div>
    <h1 id="job-state">读取中…</h1>
    <div class="seal" id="seal" aria-hidden="true"><span>印</span><span>毕</span></div>
    <div class="press" id="press" aria-hidden="true">
      <svg viewBox="0 0 104 84" fill="none" xmlns="http://www.w3.org/2000/svg">
        <g stroke="currentColor" stroke-width="1.4" stroke-linecap="round">
          <path d="M10 12h84M14 12v52M90 12v52M4 64h96"/>
        </g>
        <g class="press-roller" stroke="currentColor" stroke-linecap="round">
          <circle cx="52" cy="32" r="12" stroke-width="1.4"/>
          <path d="M52 20v24M40 32h24" stroke-width="1" opacity=".5"/>
          <circle cx="52" cy="32" r="2" fill="currentColor" stroke="none"/>
        </g>
        <path class="press-paper" d="M20 56h64" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="7 6"/>
        <g class="press-ink" fill="currentColor">
          <circle class="i1" cx="40" cy="47" r="1.7"/>
          <circle class="i2" cx="52" cy="47" r="1.7"/>
          <circle class="i3" cx="64" cy="47" r="1.7"/>
        </g>
      </svg>
    </div>
    <p class="job-url" id="job-url">—</p>
    <div class="meta" id="job-meta"></div>
    <div class="stepper-wrap">
      <span class="stepper-fill" id="stepper-fill" aria-hidden="true"></span>
      <ol class="stepper" id="stepper"></ol>
    </div>
    <div class="proof-h">LOG · 排印日志</div>
    <div class="proof" id="log"></div>
    <div class="actions" id="job-actions"></div>
    <p class="job-err" id="job-err"></p>
  </section>
</main>

<div id="toast" role="status"></div>

<script src="/static/editorial/js/common.js"></script>
<script src="/static/editorial/js/job.js"></script>

<script src="/static/editorial/js/theme.js"></script>
</body>
</html>
